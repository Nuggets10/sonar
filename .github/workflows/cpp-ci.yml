name: C++ CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.hpp.in'
      - '**/*.h'
      - '**/*.h.in'
      - '**/Makefile'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev

      - name: Compile
        run: make