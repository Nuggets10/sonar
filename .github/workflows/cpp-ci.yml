name: C++ CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.hpp.in'
      - '**/*.h'
      - '**/*.h.in'
      - '**/Makefile'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev astyle
      
      - name: Check formatting
        run: |
          find "$(dirname "$(dirname "$0")")" -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.c" -o -name "*.h" \) -not -path "*/include/libs/*" -exec astyle --project --dry-run --error-on-changes -n {} +

      - name: Compile
        run: make