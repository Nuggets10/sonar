name: C++ CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.hpp.in'
      - '**/*.h'
      - '**/*.h.in'
      - '**/Makefile'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev astyle
      
      - name: Check formatting
        run: |
          astyle --project --dry-run --error-on-changes --recursive --exclude=include/libs "*.c" "*.cpp" "*.h" "*.hpp"

      - name: Compile
        run: make